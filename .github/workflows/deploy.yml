# Автоматична публікація на GitHub Pages: кожен push у main збирає сайт і викладає його
# на https://staskrchy.github.io/Medical-Dental-Lab
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # ручний запуск з вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Одна публікація за раз; новіша скасовує ту, що ще чекає
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
